
apiVersion: apps/v1
kind: Deployment
metadata:
  name: set15-web
  namespace: lab-sets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: set15-web
  template:
    metadata:
      labels:
        app: set15-web
    spec:
      containers:
        - name: web
          image: yazhini01/set15-web:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: set15-web-service
  namespace: lab-sets
spec:
  type: NodePort
  selector:
    app: set15-web
  ports:
    - port: 80
      targetPort: 80
